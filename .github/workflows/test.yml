name: Website-Tests
on:
  # nach jedem Push auf main: zuerst der deterministische Test gegen den Repo-Stand
  push:
    branches: [main]
  # taeglicher Lauf gegen die Live-Seite (Datenprobleme, Ausfaelle, externe Aenderungen)
  schedule:
    - cron: '17 5 * * *'
  # manuell startbar (Actions-Reiter > Run workflow)
  workflow_dispatch:

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:synthetic

  live:
    # Live-Test erst, wenn GitHub Pages den neuen Stand ausgeliefert hat: wartet bis zu 6 Min. auf die Zeitachsen-Marke
    # (bei reinen Test-/Doku-Pushes entfaellt das Warten, weil die Marke schon live ist)
    runs-on: ubuntu-latest
    needs: synthetic
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Warten bis Pages die geaenderten Zeilen ausliefert
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Cloudflare sitzt vor Pages und fuegt pro Abruf eigene Skripte ein, ein Hash-Vergleich ist daher unmoeglich.
          # Stattdessen: alle in diesem Push zur index.html hinzugefuegten Zeilen (ab 20 Zeichen) muessen in der ausgelieferten Seite stehen.
          git diff --unified=0 "$BEFORE" "$GITHUB_SHA" -- index.html 2>/dev/null | grep '^+[^+]' | cut -c2- | awk 'length($0)>=20' > added.txt || true
          n=$(wc -l < added.txt | tr -d ' ')
          echo "In diesem Push hinzugefuegte Zeilen der index.html (ab 20 Zeichen): $n"
          if [ "$n" = "0" ]; then echo "Keine Aenderung an der Seite, kein Warten noetig"; exit 0; fi
          for i in $(seq 1 24); do
            code=$(curl -sS -o served.html -w '%{http_code}' "https://goldpremium.org/?nocache=$(date +%s)" || echo "curl-fehler")
            missing=$(grep -cvxFf served.html added.txt || true)
            echo "Versuch $i: HTTP $code, bytes=$(wc -c served.html 2>/dev/null | awk '{print $1}'), fehlende Zeilen=$missing von $n"
            if [ "$code" = "200" ] && [ "$missing" = "0" ]; then echo "Live-Stand enthaelt die Aenderungen des Pushs"; exit 0; fi
            sleep 15
          done
          echo "Live-Stand enthaelt die Aenderungen nach 6 Minuten nicht"; exit 1
      - run: npm run test:live
